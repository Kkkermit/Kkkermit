    <style>
      .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
      .b    { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size:17.6px }
      .main .b { fill:url(#ink) }
      .cr .b   { fill:#FF2D55 }
      .cp .b   { fill:#9D5CFF }
      .cr { opacity:.6; animation: cr 6s steps(1,end) infinite }
      .cp { opacity:.7; animation: cp 6s steps(1,end) infinite }
      .sa { opacity:0; animation: sa 6s steps(1,end) infinite }
      .sb { opacity:0; animation: sb 6s steps(1,end) infinite }
      .main { animation: jit 6s steps(1,end) infinite }
      @keyframes cr  { 0% { transform:translate(-2px,0) } 92% { transform:translate(-6px,1px) } 94% { transform:translate(4px,-1px) } 96%,100% { transform:translate(-2px,0) } }
      @keyframes cp  { 0% { transform:translate(2px,0) } 92% { transform:translate(6px,-1px) } 94% { transform:translate(-4px,1px) } 96%,100% { transform:translate(2px,0) } }
      @keyframes jit { 0% { transform:none } 92.5% { transform:translate(2px,0) } 94.5%,100% { transform:none } }
      @keyframes sa  { 0% { opacity:0; transform:none } 92% { opacity:.9; transform:translateX(18px) } 94% { opacity:.9; transform:translateX(-12px) } 96%,100% { opacity:0; transform:none } }
      @keyframes sb  { 0% { opacity:0; transform:none } 93% { opacity:.9; transform:translateX(-20px) } 95% { opacity:.9; transform:translateX(8px) } 97%,100% { opacity:0; transform:none } }
      .roll { animation: roll 6s linear infinite }
      @keyframes roll { from { transform:translateY(-90px) } to { transform:translateY(300px) } }
      .flick { animation: flick 7s steps(1,end) infinite }
      @keyframes flick { 0% { opacity:1 } 96.5% { opacity:.82 } 97.2% { opacity:1 } 98% { opacity:.9 } 98.6%,100% { opacity:1 } }
      .dot { animation: dot 1.4s steps(1,end) infinite }
      @keyframes dot { 0% { opacity:1 } 50% { opacity:.15 } }
      .tick { animation: tick 27.98s linear infinite }
      @keyframes tick { from { transform:translateX(0) } to { transform:translateX(-1539px) } }
      @media (prefers-reduced-motion: reduce) { .cr,.cp,.sa,.sb,.main,.roll,.flick,.dot,.tick { animation: none !important } }
    </style>
