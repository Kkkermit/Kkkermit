<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 14" width="1000" height="14" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF3B5C" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF3B5C" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#9D5CFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9D5CFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .orb { animation: run 6s ease-in-out infinite }
      @keyframes run { 0%,100% { transform: translateX(140px) } 50% { transform: translateX(860px) } }
      @media (prefers-reduced-motion: reduce) { .orb { animation: none !important } }
    </style>
  </defs>
  <rect x="0" y="6" width="1000" height="2" rx="1" fill="url(#line)"/>
  <g class="orb"><circle cx="0" cy="7" r="10" fill="#FF7A93" opacity="0.18"/><circle cx="0" cy="7" r="4" fill="#FF7A93"/></g>
</svg>
