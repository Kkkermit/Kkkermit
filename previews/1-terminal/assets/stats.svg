<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" width="480" height="250" role="img" aria-label="GITHUB STATS">
  <defs>
    <linearGradient id="rail-stats" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#9D5CFF"/>
    </linearGradient>
    
    <style>
      .m { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
      .s { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif }
      .hd  { font-size:12px; font-weight:700; letter-spacing:2.4px; fill:#FF5C78 }
      .lbl { font-size:12px; fill:#A3939C; letter-spacing:0.6px }
      .num { font-size:24px; font-weight:700; fill:#F2E8EC }
      .ttl { font-size:17px; font-weight:700; fill:#F2E8EC }
      .dsc { font-size:13.5px; fill:#A3939C }
      .in  { animation: in .6s ease-out backwards }
      @keyframes in { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
      @media (prefers-reduced-motion: reduce) { .in { animation: none } }
    </style>
  </defs>
  <rect x="0.75" y="0.75" width="478.5" height="248.5" rx="12" fill="#110B10" stroke="#2E1823" stroke-width="1.5"/>
  
  <rect x="0.75" y="16" width="3" height="218" rx="1.5" fill="url(#rail-stats)"/>
  <text class="m hd" x="24" y="36">GITHUB STATS</text>
  <g class="in" style="animation-delay:0.00s">
    <rect x="24" y="69" width="6" height="6" rx="1" fill="#FF3B5C"/>
    <text class="m lbl" x="38" y="76">STARS</text>
    <text class="m num" x="24" y="104">170</text>
  </g>
  <g class="in" style="animation-delay:0.07s">
    <rect x="246" y="69" width="6" height="6" rx="1" fill="#9D5CFF"/>
    <text class="m lbl" x="260" y="76">COMMITS</text>
    <text class="m num" x="246" y="104">953</text>
  </g>
  <g class="in" style="animation-delay:0.14s">
    <rect x="24" y="127" width="6" height="6" rx="1" fill="#FF3B5C"/>
    <text class="m lbl" x="38" y="134">FORKS</text>
    <text class="m num" x="24" y="162">66</text>
  </g>
  <g class="in" style="animation-delay:0.21s">
    <rect x="246" y="127" width="6" height="6" rx="1" fill="#9D5CFF"/>
    <text class="m lbl" x="260" y="134">PULL REQUESTS</text>
    <text class="m num" x="246" y="162">58</text>
  </g>
  <g class="in" style="animation-delay:0.28s">
    <rect x="24" y="185" width="6" height="6" rx="1" fill="#FF3B5C"/>
    <text class="m lbl" x="38" y="192">PUBLIC REPOS</text>
    <text class="m num" x="24" y="220">10</text>
  </g>
  <g class="in" style="animation-delay:0.35s">
    <rect x="246" y="185" width="6" height="6" rx="1" fill="#9D5CFF"/>
    <text class="m lbl" x="260" y="192">FOLLOWERS</text>
    <text class="m num" x="246" y="220">20</text>
  </g>
  
</svg>
