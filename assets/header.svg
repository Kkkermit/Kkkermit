<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Kkermit - Frontend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#0F1720"/>
      <stop offset="100%" stop-color="#12241A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3FB950"/>
      <stop offset="50%" stop-color="#7EE787"/>
      <stop offset="100%" stop-color="#2EA043"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EE787" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7EE787" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#7EE787" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="16"/></clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,monospace; }
      .name { font-size: 58px; font-weight: 800; letter-spacing: -1.5px; }
      .role { font-size: 19px; font-weight: 500; letter-spacing: 3.4px; }
      .meta { font-size: 13px; font-weight: 400; letter-spacing: 0.6px; }

      .cursor  { animation: blink 1.05s step-end infinite; }
      .sweepbar{ animation: slide 6s ease-in-out infinite; }
      .float-a { animation: bob 5.5s ease-in-out infinite; }
      .float-b { animation: bob 7s ease-in-out infinite reverse; }
      .pulse   { animation: pulse 3.2s ease-in-out infinite; }
      .dash    { stroke-dasharray: 6 10; animation: march 3s linear infinite; }

      @keyframes blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
      @keyframes slide { 0% {transform:translateX(-420px)} 50% {transform:translateX(1000px)} 100% {transform:translateX(1000px)} }
      @keyframes bob   { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-9px)} }
      @keyframes pulse { 0%,100% {opacity:0.35} 50% {opacity:0.9} }
      @keyframes march { to { stroke-dashoffset: -64; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <ellipse cx="830" cy="120" rx="240" ry="180" fill="url(#glow)"/>

    <!-- moving light sweep -->
    <rect class="sweepbar" x="0" y="0" width="420" height="240" fill="url(#sweep)" opacity="0.28"/>

    <!-- left accent rail -->
    <rect x="0" y="0" width="5" height="240" fill="url(#accent)"/>

    <!-- terminal prompt line -->
    <g transform="translate(56, 58)">
      <text class="mono meta" fill="#3FB950">
        <tspan>~/</tspan><tspan fill="#8B949E">github</tspan><tspan fill="#3FB950"> $</tspan>
        <tspan fill="#E6EDF3" dx="8">whoami</tspan>
      </text>
    </g>

    <!-- name -->
    <text class="mono name" x="54" y="128" fill="#E6EDF3">
      Kkermit<tspan fill="#3FB950">.</tspan>
      <tspan class="cursor" fill="#7EE787" dx="6">_</tspan>
    </text>

    <!-- role -->
    <text class="mono role" x="58" y="164" fill="#7EE787">FRONTEND DEVELOPER</text>

    <!-- meta line -->
    <text class="mono meta" x="58" y="196" fill="#8B949E">
      React · TypeScript · Redux
      <tspan fill="#30363D" dx="10">|</tspan>
      <tspan fill="#8B949E" dx="10">test-driven, component-first</tspan>
    </text>

    <!-- right-side abstract: nested component boxes -->
    <g transform="translate(742, 44)" fill="none" stroke-width="1.6">
      <rect class="float-a" x="0"  y="0"  width="180" height="152" rx="12" stroke="#3FB950" stroke-opacity="0.55"/>
      <rect class="float-b" x="22" y="26" width="136" height="100" rx="9"  stroke="#7EE787" stroke-opacity="0.45"/>
      <rect class="float-a" x="46" y="52" width="88"  height="48"  rx="6"  stroke="#7EE787" stroke-opacity="0.8"/>
      <circle class="pulse" cx="90" cy="76" r="5" fill="#7EE787" stroke="none"/>
      <path class="dash" d="M90 0 V52 M90 100 V152 M0 76 H46 M134 76 H180" stroke="#3FB950" stroke-opacity="0.5"/>
    </g>

    <!-- corner nodes -->
    <g fill="#3FB950">
      <circle class="pulse" cx="962" cy="30" r="3"/>
      <circle class="pulse" cx="978" cy="30" r="3" opacity="0.6"/>
      <circle class="pulse" cx="946" cy="30" r="3" opacity="0.35"/>
    </g>

    <rect x="0" y="236" width="1000" height="4" fill="url(#accent)"/>
  </g>
</svg>
