  <line x1="24" y1="200" x2="456" y2="200" stroke="#3A1220"/>
  <text class="m lbl" x="24" y="224" font-size="11">across 10 public repos</text>
  <text class="m lbl" x="456" y="224" font-size="11" text-anchor="end">updated daily</text>
  <rect x="0.75" y="0.75" width="478.5" height="248.5" rx="12" fill="url(#scan)"/>
