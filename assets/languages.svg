    <text class="m lbl" x="220" y="104" text-anchor="end">90.6%</text>
  </g>
  <g class="in" style="animation-delay:0.08s">
    <rect x="246" y="94" width="10" height="10" rx="2" fill="#FF5C7A"/>
    <text class="m lbl" x="264" y="104" style="fill:#FFE9EE">Python</text>
    <text class="m lbl" x="442" y="104" text-anchor="end">5.1%</text>
  </g>
  <g class="in" style="animation-delay:0.16s">
    <rect x="24" y="128" width="10" height="10" rx="2" fill="#D63384"/>
    <text class="m lbl" x="42" y="138" style="fill:#FFE9EE">JavaScript</text>
    <text class="m lbl" x="220" y="138" text-anchor="end">2.7%</text>
  </g>
  <g class="in" style="animation-delay:0.24s">
    <rect x="246" y="128" width="10" height="10" rx="2" fill="#A855F7"/>
    <text class="m lbl" x="264" y="138" style="fill:#FFE9EE">Java</text>
    <text class="m lbl" x="442" y="138" text-anchor="end">1.0%</text>
  </g>
  <g class="in" style="animation-delay:0.32s">
