<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3FB950" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#3FB950" stop-opacity="0.75"/>
      <stop offset="50%"  stop-color="#7EE787" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#3FB950" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <style>
      .orb { animation: run 5s ease-in-out infinite; }
      @keyframes run { 0%,100% { transform: translateX(120px) } 50% { transform: translateX(880px) } }
    </style>
  </defs>
  <rect x="0" y="5" width="1000" height="2" rx="1" fill="url(#line)"/>
  <circle class="orb" cx="0" cy="6" r="4" fill="#7EE787"/>
  <circle class="orb" cx="0" cy="6" r="9" fill="#7EE787" opacity="0.18"/>
</svg>
