name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"  # This means at midnight every day
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate snake-crt.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-crt.svg?color_snake=#7C3AED&color_dots=#EBEBEF,#FBCFD8,#F7A1B2,#F2667F,#E11D48
            dist/snake-crt-dark.svg?palette=github-dark&color_snake=#8B5CF6&color_dots=#1C1C22,#5A1A2B,#9A2440,#D8314F,#F43F5E
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push snake-crt.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
